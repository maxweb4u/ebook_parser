name: ebook_parser
description: >-
  Parse EPUB and FB2 ebooks into one shared document model with lazy
  sentence and word segmentation, metadata-only reads, and .fb2.zip support.
version: 0.1.0
topics:
  - epub
  - fb2
  - ebook
  - parser
  - reader

environment:
  sdk: ^3.0.0

dependencies:
  archive: ^4.0.0
  enough_convert: ^1.6.0
  html: ^0.15.4
  path: ^1.9.0
  xml: ^6.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
